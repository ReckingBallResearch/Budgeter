<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budgeter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6;--surface:#ffffff;--ink:#141c2b;--muted:#5d6a80;--line:#d6dce8;
  --accent:#2f4bd8;--on-accent:#ffffff;--soft:#e4e9fc;
  --pos:#137a56;--neg:#b93a26;--warn:#8a5a06;--posbg:#dcf3e8;--negbg:#f8e2dd;--warnbg:#fbeccb;
  --head:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e131d;--surface:#161d2b;--ink:#e8ecf5;--muted:#93a0b8;--line:#263149;
    --accent:#8ea2ff;--on-accent:#0e131d;--soft:#1f2a52;
    --pos:#4cd39b;--neg:#ff8b78;--warn:#e8b04d;--posbg:#123428;--negbg:#3b1e19;--warnbg:#3a2c0d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131d;--surface:#161d2b;--ink:#e8ecf5;--muted:#93a0b8;--line:#263149;
  --accent:#8ea2ff;--on-accent:#0e131d;--soft:#1f2a52;
  --pos:#4cd39b;--neg:#ff8b78;--warn:#e8b04d;--posbg:#123428;--negbg:#3b1e19;--warnbg:#3a2c0d;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:18px 0 10px}
h1{font:700 26px/1.1 var(--head);margin:0;letter-spacing:-.01em}
h2{font:700 19px/1.2 var(--head);margin:0 0 10px}
h3{font:700 18px/1.2 var(--head);margin:0 0 14px}
.mn{display:flex;align-items:center;gap:6px}
#mlabel{font:700 17px var(--head);min-width:120px;text-align:center}
.st{font-size:12.5px;color:var(--muted);min-width:80px;text-align:right}
.st.bad{color:var(--neg)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{padding:10px 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font:600 14px var(--body);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.btn{font:600 14px var(--body);padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--neg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lnk{background:none;border:0;padding:0;color:var(--accent);font:600 15px var(--body);cursor:pointer;text-decoration:underline}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
input[type=checkbox]{width:auto}
.mini{width:104px;text-align:right;padding:4px 8px}
.sec{margin:26px 0}
.muted{color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.eq{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;padding:20px 0 6px}
.eq .t{display:flex;flex-direction:column;min-width:0}
.eq small{color:var(--muted);font-size:13px}
.eq b{font:700 30px/1.1 var(--head);letter-spacing:-.01em}
.eq .op{font:500 24px/1 var(--head);color:var(--muted);padding-bottom:4px}
.eq .free b{font-size:38px}
.note{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13.5px;color:var(--muted);margin:4px 0 0}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.alert{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;margin:14px 0 0;font-size:14px}
.alert.late{background:var(--negbg);color:var(--neg)}
.alert .muted{color:inherit;opacity:.85}
.tip{display:flex;gap:6px 12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:8px}
.tip>span{flex:1;min-width:220px}
.chip.note{background:var(--warnbg);color:var(--warn);font-weight:600}
.chip.save{background:var(--soft);color:var(--accent)}
.mid{width:150px}
.need{border-color:var(--neg)}
tr.short td:first-child{box-shadow:inset 3px 0 0 var(--neg)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
td.act{text-align:right;white-space:nowrap}
tr.done td{opacity:.5}
tr.past td{color:var(--muted)}
tr.tot td{font-weight:600;background:var(--bg)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--accent);margin-left:6px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--neg)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal>div{background:var(--surface);min-height:84px;padding:4px 5px;min-width:0}
.cal>.dow{min-height:0;text-align:center;color:var(--muted);font-size:12px;padding:5px 0}
.cal>.blank{background:var(--bg)}
.cal .day{font-size:12px;color:var(--muted)}
.cal .today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .today .day{color:var(--accent);font-weight:700}
.chip{display:block;font-size:11px;line-height:1.35;margin-top:2px;padding:1px 4px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.in{background:var(--posbg);color:var(--pos)}
.chip.out{background:var(--negbg);color:var(--neg)}
.chip.done{opacity:.45;text-decoration:line-through}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.row .grow{flex:1;min-width:160px}
.goal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 8px}
.goal .nm{font-weight:600}
.goal .meta{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.goal .bar{grid-column:1/-1}
.foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px}
ol.start{padding-left:20px;line-height:2}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto}
dialog::backdrop{background:rgba(10,15,30,.55)}
.fld{display:grid;gap:4px;margin:0 0 12px}
.fld[hidden]{display:none}
.fld label{font-size:13px;color:var(--muted)}
.fld small{color:var(--muted);font-size:12.5px}
.fld.two{grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--neg);font-size:13.5px;min-height:1em;margin:0 0 8px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.acts.left{justify-content:flex-start;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20}
@media (max-width:640px){
  .cal>div{min-height:52px}
  .chip{font-size:0;height:7px;width:7px;padding:0;display:inline-block;border-radius:50%;margin:3px 2px 0 0}
    .chip.in{background:var(--pos)}.chip.out{background:var(--neg)}.chip.note{background:var(--warn)}.chip.save{background:var(--accent)}
  .eq b{font-size:24px}.eq .free b{font-size:30px}
  th,td{padding:8px 8px}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:fade .2s}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Budgeter</h1>
    <div class="mn" id="mnav">
      <button class="btn sm" data-act="prev" aria-label="Previous month">&lsaquo;</button>
      <span id="mlabel"></span>
      <button class="btn sm" data-act="next" aria-label="Next month">&rsaquo;</button>
      <button class="btn sm ghost" data-act="today">Today</button>
    </div>
    <span id="st" class="st"></span>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="overview">Overview</button>
    <button class="tab" role="tab" data-tab="income">Income</button>
    <button class="tab" role="tab" data-tab="bills">Bills</button>
    <button class="tab" role="tab" data-tab="accounts">Accounts</button>
    <button class="tab" role="tab" data-tab="tx">Transactions</button>
    <button class="tab" role="tab" data-tab="goals">Goals</button>
  </div>
  <main id="main"><p class="muted">Loading…</p></main>
  <div class="foot"><button class="btn sm" data-act="backup">Download backup</button><button class="btn sm" data-act="restore">Restore from backup</button><input type="file" id="rf" accept=".json,application/json" hidden><span class="muted">Changes save automatically to your account and to this device.</span></div>
</div>
<dialog id="dlg"></dialog>
<script>
(()=>{
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f0=n=>(n<-0.5?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const f2=n=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const sum=a=>a.reduce((s,e)=>s+(+e.amt||0),0);
const now=new Date();
const TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const dl=iso=>iso?`${MON[+iso.slice(5,7)-1]} ${+iso.slice(8,10)}`:'';
const FREQS=[['monthly','Monthly'],['semi','Twice a month'],['biweekly','Every 2 weeks'],['weekly','Weekly'],['quarterly','Every 3 months'],['semiannual','Every 6 months'],['yearly','Yearly'],['once','One time']];
const TYPES=[['checking','Checking'],['savings','Savings'],['cash','Cash'],['investment','Investment'],['retirement','Retirement (401k, IRA)'],['credit','Credit card'],['loan','Loan']];
const DEFAULT_CATS=['Housing','Utilities','Food','Transport','Insurance','Subscriptions','Health','Shopping','Entertainment','Debt payment','Travel','Savings','Other'];
const RESERVED=['Income','Transfer','Uncategorized'];
const DEFAULT_RULES='grocery = Food\nrestaurant = Food\ncafe = Food\ncoffee = Food\nuber = Transport\nlyft = Transport\nparking = Transport\nnetflix = Subscriptions\nspotify = Subscriptions\npayment thank you = Transfer\nautopay = Transfer\ntransfer = Transfer';
const blank=()=>({v:1,income:[],bills:[],accounts:[],goals:[],cats:DEFAULT_CATS.map(name=>({name,budget:0})),rules:DEFAULT_RULES,done:{},actual:{},applied:{},showPlanned:false,interestIn:false});

let plan=null,tx={},view={y:now.getFullYear(),m:now.getMonth()},tab='overview',fq='',fcat='';
const mk=v=>`${v.y}-${pad(v.m+1)}`;
const isDebt=a=>a&&(a.type==='credit'||a.type==='loan');
const acct=id=>plan.accounts.find(a=>a.id===id);
const acctName=id=>acct(id)?.name||'—';

/* ---------- storage: a copy on this device and a copy in your account ---------- */
const S={db:null,uid:null,locked:false};
const lget=k=>{try{const v=localStorage.getItem('planner:'+k);return v?JSON.parse(v):null}catch(e){return null}};
const lset=(k,o)=>{try{localStorage.setItem('planner:'+k,JSON.stringify(o));return true}catch(e){return false}};
const cpath=k=>`data/users/${S.uid}/${k}`;
const pend={},timers={},chain={};
function status(t,c){const e=$('#st');e.textContent=t;e.className='st '+(c||'')}
const okMsg=()=>S.db?'Saved to account and device':'Saved on this device';
async function sRead(k){
  const l=lget(k);let c=null;
  if(S.db){const s=await S.db.doc(cpath(k)).get();c=s.exists?clone(s.data()):null}
  if(l&&(!c||(l._ts||0)>(c._ts||0))){if(S.db){pend[k]=l;timers[k]=setTimeout(()=>flushKey(k),400)}return l}
  return c;
}
function flushKey(k){
  clearTimeout(timers[k]);const o=pend[k];if(!o||!S.db)return;delete pend[k];
  chain[k]=(chain[k]||Promise.resolve()).then(()=>S.db.doc(cpath(k)).set(o)).then(()=>{if(!Object.keys(pend).length)status(okMsg())},()=>{
    pend[k]=pend[k]||o;timers[k]=setTimeout(()=>flushKey(k),10000);status('Saved on this device, retrying account','bad');
  });
}
const flushAll=()=>Object.keys(pend).forEach(flushKey);
function persist(k,get){
  if(S.locked)return;
  const o=clone(get());o._ts=Date.now();
  const ok=lset(k,o);
  if(!S.db){status(ok?okMsg():'Could not save',ok?'':'bad');return}
  pend[k]=o;status('Saving…');clearTimeout(timers[k]);timers[k]=setTimeout(()=>flushKey(k),500);
}
const savePlan=()=>persist('plan',()=>plan);
const saveTx=m=>persist('tx-'+m,()=>tx[m]);
async function allMonths(){
  const set=new Set(Object.keys(tx));
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('planner:tx-'))set.add(k.slice(11))}}catch(e){}
  if(S.db){try{(await S.db.collection('data/users/'+S.uid).get()).docs.forEach(d=>{if(d.id.startsWith('tx-'))set.add(d.id.slice(3))})}catch(e){toast('Backup may be missing older months')}}
  return[...set].filter(m=>/^\d{4}-\d{2}$/.test(m)).sort();
}
async function saveFile(filename,data,type){
  let dm=null;try{dm=window.claude?await claude.use('downloads'):null}catch(e){}
  if(dm)await dm.save({filename,data});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}
}
async function backup(){
  const months=await allMonths(),t={};
  for(const m of months){await ensureTx(m);t[m]={items:tx[m].items}}
  const data=JSON.stringify({app:'monthly-planner',version:1,exported:new Date().toISOString(),plan,tx:t},null,1),filename=`monthly-planner-backup-${TODAY}.json`;
  try{await saveFile(filename,data,'application/json');toast(`Backup ready: plan and ${months.length} months of transactions`)}catch(e){toast('Backup was not saved')}
}
function restore(file){
  const r=new FileReader();
  r.onload=()=>{
    let b;try{b=JSON.parse(String(r.result))}catch(e){toast('That file is not a valid backup');return}
    const ok=b&&b.app==='monthly-planner'&&b.plan&&['income','bills','accounts','goals','cats'].every(k=>Array.isArray(b.plan[k]));
    if(!ok){toast('That file is not a planner backup');return}
    const ms=Object.keys(b.tx||{}).filter(m=>/^\d{4}-\d{2}$/.test(m)&&b.tx[m]&&Array.isArray(b.tx[m].items));
    ask(`Restore your plan and ${ms.length} months of transactions from this backup${b.exported?' ('+b.exported.slice(0,10)+')':''}?`,'Restore',()=>{
      plan=Object.assign(blank(),b.plan);savePlan();
      ms.forEach(m=>{tx[m]={items:b.tx[m].items};saveTx(m)});
      render();toast('Backup restored');
    });
  };
  r.readAsText(file);
}
async function ensureTx(m){
  if(tx[m])return;
  try{tx[m]=(await sRead('tx-'+m))||{items:[]}}catch(e){S.locked=true;tx[m]={items:[]};status('Load failed: reload before editing','bad')}
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}

/* ---------- schedules ---------- */
function occ(it,y,m){
  if(!it.date)return[];
  const [ay,am,ad]=it.date.split('-').map(Number);
  const dim=new Date(y,m+1,0).getDate(),mi=y*12+m,ai=ay*12+am-1,f=it.freq,o=[];
  const k=d=>`${y}-${pad(m+1)}-${pad(d)}`,c=d=>Math.min(Math.max(1,d),dim);
  if(f==='weekly'||f==='biweekly'){
    const st=f==='weekly'?7:14,a=Date.UTC(ay,am-1,ad);
    for(let d=1;d<=dim;d++){const diff=(Date.UTC(y,m,d)-a)/864e5;if(diff>=0&&diff%st===0)o.push(k(d))}
  }else if(mi>=ai){
    if(f==='once'){if(mi===ai)o.push(k(ad))}
    else if(f==='monthly')o.push(k(c(ad)));
    else if(f==='semi'){o.push(k(c(ad)));o.push(k(c(+it.day2||15)))}
    else if(f==='quarterly'){if((mi-ai)%3===0)o.push(k(c(ad)))}
    else if(f==='semiannual'){if((mi-ai)%6===0)o.push(k(c(ad)))}
    else if(f==='yearly'){if((mi-ai)%12===0)o.push(k(c(ad)))}
  }
  return [...new Set(o)].sort().filter(d=>d>=it.date&&(!it.end||d<=it.end));
}
function sched(i){
  const [y,m,d]=(i.date||'').split('-').map(Number);if(!d)return'';
  const md=`${MON[m-1]} ${d}`;
  const s={monthly:`Monthly on the ${ord(d)}`,semi:`Twice a month, the ${ord(d)} and ${ord(+i.day2||15)}`,biweekly:`Every 2 weeks from ${md}`,weekly:`Weekly from ${md}`,quarterly:`Every 3 months from ${md}`,semiannual:`Every 6 months from ${md}`,yearly:`Yearly on ${md}`,once:`Once on ${md}, ${y}`}[i.freq]||'';
  return s+(i.end?`, until ${MON[+i.end.slice(5,7)-1]} ${i.end.slice(0,4)}`:'');
}
const PER={weekly:52,biweekly:26,semi:24,monthly:12,quarterly:4,semiannual:2,yearly:1,once:1};
const cardPay=a=>a.type==='credit'&&(+a.stmt>0||+a.typ>0)&&(!!a.duedate||+a.due>0);
const cardSched=a=>a.duedate?[+a.stmt>0?`Due ${dl(a.duedate)}`:'',+a.typ>0?`${+a.stmt>0?'then ':''}about ${f2(+a.typ)} a month`:'nothing scheduled after that'].filter(Boolean).join(', '):`On the ${ord(+a.due)} (date not confirmed)`;
const hasInt=a=>!isDebt(a)&&a.type!=='investment'&&a.type!=='retirement'&&+a.apy>0;
const rate=a=>Math.pow(1+(+a.apy||0)/100,1/12)-1;
const mInt=a=>Math.round((+a.bal||0)*rate(a)*100)/100;
const divItem=id=>{const a=acct(id.slice(4));return a?{name:a.name+' dividend',amt:+a.divAmt||0}:null};
const intItem=id=>{const a=acct(id.slice(4));return a?{name:a.name+' interest',amt:mInt(a)}:null};
function evs(y,m){
  const o=[],act=plan.actual||{};
  const mkEv=(t,it,d,x)=>{const key=`${t}:${it.id}:${d}`,has=act[key]!=null;return{t,id:it.id,name:it.name,amt:has?+act[key]:(+it.amt||0),est:+it.amt||0,variable:!!it.variable,hasActual:has,date:d,acct:it.acct,key,...x}};
  plan.income.forEach(i=>occ(i,y,m).forEach(d=>o.push(mkEv('in',i,d))));
  plan.bills.forEach(b=>{if(b.planned&&!plan.showPlanned)return;occ(b,y,m).forEach(d=>o.push(mkEv('out',b,d,{planned:!!b.planned})))});
  if(y*12+m>=now.getFullYear()*12+now.getMonth())plan.accounts.forEach(a=>{
    if(a.type==='loan'){

const isoOf=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;

  const lastDow=(m,dow)=>{const l=new Date(y,m+1,0);return l.getDate()-((l.getDay()-dow+7)%7)};
  const fixed=(m,d)=>{const dt=new Date(y,m,d),w=dt.getDay();if(w===6)return;if(w===0)dt.setDate(d+1);set.add(isoOf(dt))};
  const day=(m,d)=>set.add(isoOf(new Date(y,m,d)));
  fixed(0,1);day(0,nth(0,1,3));day(1,nth(1,1,3));day(4,lastDow(4,1));fixed(5,19);fixed(6,4);day(8,nth(8,1,1));day(9,nth(9,1,2));fixed(10,11);day(10,nth(10,4,4));fixed(11,25);

function project(){

  if(vi<ti)return{list:cur,end:null,tips:[]};
  const bal={},hold={},inj={},tips=[];let end=null,endH=null;plan.accounts.forEach(a=>{const inv=a.type==='investment';bal[a.id]=inv?(+a.cash||0):(+a.bal||0);if(inv)hold[a.id]=+a.bal||0});
  for(let i=ti;i<=vi+1;i++){

      if(e.date<TODAY||plan.done[e.key])return;
      const a=acct(e.acct);

    if(map.amt>=0){let neg=0,pos=0;raw.slice(hasH?1:0).forEach(r=>{const v=pn(r[map.amt]);if(v<0)neg++;else if(v>0)pos++});sign=neg>=pos?'neg':'pos'}

    $('#imap').innerHTML=`<div class="fld two"><div class="fld"><label>Date column</label><select id="md">${opt(map.date)}</select></div><div class="fld"><label>Description column</label><select id="ms">${opt(map.desc)}</select></div>

    return`<tr><td>${esc(i.name)}${i.planned?'<span class="pill">planned</span>':''}${i.auto?'<span class="pill">autopay</span>':''}${i.variable?'<span class="pill">estimate</span>':''}${sub}</td><td class="num">${i.variable?'~':''}${f2(+i.amt||0)}</td><td>${esc(sched(i))}</td><td>${esc(acctName(i.acct))}</td>${isB?`<td>${esc(i.cat||'')}</td>`:''}<td class="act"><button class="btn sm" data-act="edit" data-kind="${kind}" data-id="${i.id}">Edit</button> <button class="btn sm ghost danger" data-act="del" data-kind="${kind}" data-id="${i.id}">Delete</button></td></tr>`;
  }).join('')+cards.map(a=>`<tr><td>${esc(a.name)} payment<span class="pill">card statement</span><div class="muted" style="font-size:13px">Pays the statement balance. Change it on the Accounts tab.</div></td><td class="num">${+a.stmt>0?f2(+a.stmt):'—'}</td><td>${esc(cardSched(a))}</td><td>${esc(acctName(a.payfrom))}</td><td>Credit card</td><td class="act"><button class="btn sm" data-act="edit" data-kind="accounts" data-id="${a.id}">Edit</button></td></tr>`).join('')+lns.map(a=>`<tr><td>${esc(a.name)} payment<span class="pill">loan</span>${a.lauto?'<span class="pill">autopay</span>':''}<div class="muted" style="font-size:13px">Set on the Accounts tab.</div></td><td class="num">${f2(+a.min)}</td><td>${a.pdate?esc(sched({freq:'monthly',date:a.pdate,end:a.lend})):'No payment date set'}</td><td>${esc(acctName(a.lfrom))}</td><td>Loan</td><td class="act"><button class="btn sm" data-act="edit" data-kind="accounts" data-id="${a.id}">Edit</button></td></tr>`).join('');
  return`<div class="sec">${head}<div class="scroll"><table><thead><tr><th>${isB?'Bill':'Source'}</th><th class="num">Amount</th><th>Schedule</th><th>${isB?'Pays from':'Deposits into'}</th>${isB?'<th>Category</th>':''}<th></th></tr></thead><tbody>${rows}</tbody></table></div></div>${history(isB?'out':'in')}`;
}
function vAccounts(){
  const {end,endH}=project(),as=plan.accounts.filter(a=>!isDebt(a)&&a.type!=='investment'&&a.type!=='retirement'),rt=plan.accounts.filter(a=>a.type==='retirement'),inv=plan.accounts.filter(a=>a.type==='investment'),cards=plan.accounts.filter(a=>a.type==='credit'),loans=plan.accounts.filter(a=>a.type==='loan');
  const A=as.reduce((s,a)=>s+(+a.bal||0),0)+inv.reduce((s,a)=>s+(+a.bal||0)+(+a.cash||0),0)+rt.reduce((s,a)=>s+(+a.bal||0),0),D=[...cards,...loans].reduce((s,a)=>s+(+a.bal||0),0);
  const endTh=end?`<th class="num">End of ${MON[view.m]}</th>`:'';
  const balCell=a=>`<td class="num"><input class="mini" type="number" step="any" value="${+a.bal||0}" data-act="bal" data-id="${a.id}" aria-label="Balance of ${esc(a.name)}"></td>`;
  const endCell=a=>end?`<td class="num ${end[a.id]<0&&!isDebt(a)?'neg':''}">${f0(end[a.id])}</td>`:'';
  const btns=a=>`<td class="act"><button class="btn sm" data-act="edit" data-kind="accounts" data-id="${a.id}">Edit</button> <button class="btn sm ghost danger" data-act="del" data-kind="accounts" data-id="${a.id}">Delete</button></td>`;
  const tbl=(rows,head)=>rows.length?`<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`:'';
  const intTot=as.filter(hasInt).reduce((s,a)=>s+mInt(a),0);
  const limCells=a=>{const L=+a.limit||0,B=+a.bal||0;return`<td class="num"><input class="mini" type="number" step="any" min="0" value="${L||''}" placeholder="0" data-act="limit" data-id="${a.id}" aria-label="Credit limit of ${esc(a.name)}"></td><td class="num">${L?Math.round(B/L*100)+'%':'—'}</td><td class="num ${L&&B>L?'neg':''}">${L?f0(L-B):'—'}</td>`};
  const lc=cards.filter(a=>+a.limit>0),tLim=lc.reduce((s,a)=>s+(+a.limit),0),tOwed=lc.reduce((s,a)=>s+(+a.bal||0),0),anyLim=loans.some(a=>+a.limit>0);
  const tn=a=>esc(TYPES.find(t=>t[0]===a.type)?.[1]||'');
  return`<div class="row" style="margin-top:16px"><button class="btn pri" data-act="add" data-kind="accounts">Add account</button></div>
  ${plan.accounts.length?`<div class="eq"><div class="t"><small>Assets</small><b>${f0(A)}</b></div><span class="op">−</span><div class="t"><small>Debts</small><b>${f0(D)}</b></div><span class="op">=</span><div class="t free"><small>Net worth</small><b class="${A-D<0?'neg':''}">${f0(A-D)}</b></div></div>`:'<div class="empty">No accounts yet. Add checking, savings, cards and loans with their balances.</div>'}
  ${as.length?`<div class="sec"><h2>Accounts</h2>${tbl(as.map(a=>`<tr><td>${esc(a.name)}</td><td>${tn(a)}</td>${balCell(a)}<td class="num"><input class="mini" style="width:76px" type="number" step="any" min="0" value="${+a.apy||''}" placeholder="0" data-act="apy" data-id="${a.id}" aria-label="APY of ${esc(a.name)}"></td><td class="num">${hasInt(a)?f2(mInt(a)):'—'}</td>${endCell(a)}${btns(a)}</tr>`).join(''),`<th>Name</th><th>Type</th><th class="num">Balance</th><th class="num">APY %</th><th class="num">Interest a month</th>${endTh}<th></th>`)}${intTot?`<p class="muted" style="font-size:13px">Estimated interest: ${f2(intTot)} a month, about ${f0(intTot*12)} a year. It appears on your calendar the day it is credited. Enter the real amount there when it posts.</p>`:''}</div>`:''}
  ${inv.length?`<div class="sec"><h2>Investments</h2>${tbl(inv.map(a=>`<tr><td>${esc(a.name)}</td>${balCell(a)}<td class="num"><input class="mini" type="number" step="any" value="${+a.cash||0}" data-act="cash" data-id="${a.id}" aria-label="Buying power of ${esc(a.name)}"></td><td class="num">${f0((+a.bal||0)+(+a.cash||0))}</td><td>${+a.divAmt>0?`${f2(+a.divAmt)}, ${esc(FREQS.find(f=>f[0]===(a.divFreq||'quarterly'))?.[1]||'')}, ${a.divMode==='reinvest'?'reinvested':'to buying power'}`:'—'}</td>${end?`<td class="num">${f0(endH[a.id])} invested<br>${f0(end[a.id])} buying power</td>`:''}${btns(a)}</tr>`).join(''),`<th>Name</th><th class="num">Invested</th><th class="num">Buying power</th><th class="num">Total</th><th>Dividends</th>${endTh}<th></th>`)}<p class="muted" style="font-size:13px">Buying power across your investment accounts: ${f0(inv.reduce((s,a)=>s+(+a.cash||0),0))}. Recording a dividend on the Overview adds it to buying power, or to the invested value if it is auto-reinvested. Edit the numbers here any time to match your broker.</p></div>`:''}
  ${rt.length?`<div class="sec"><h2>Retirement</h2>${tbl(rt.map(a=>{const n=PER[a.cfreq||'biweekly']||0,you=+a.contrib||0,er=+a.match||0;return`<tr><td>${esc(a.name)}</td>${balCell(a)}<td>${you>0||er>0?`${you>0?`You ${f2(you)} (${a.cfrom?'from '+esc(acctName(a.cfrom)):'payroll'})`:''}${you>0&&er>0?', ':''}${er>0?`employer ${f2(er)}`:''}<div class="muted" style="font-size:13px">${esc(sched({freq:a.cfreq,date:a.cdate,day2:a.cday2}))}</div>`:'—'}</td><td class="num">${(you+er)>0?f0((you+er)*n):'—'}${you>0&&er>0?`<div class="muted" style="font-size:13px">you ${f0(you*n)}</div>`:''}</td>${end?`<td class="num">${f0(end[a.id])}</td>`:''}${btns(a)}</tr>`}).join(''),`<th>Name</th><th class="num">Balance</th><th>Contributions</th><th class="num">Per year</th>${endTh}<th></th>`)}<p class="muted" style="font-size:13px">Payroll contributions come out of your paycheck before it reaches the bank, so they are not counted as bills. Projected balances include contributions and any expected return.</p></div>`:''}
  ${cards.length?`<div class="sec"><h2>Credit cards</h2>${tbl(cards.map(a=>`<tr><td>${esc(a.name)}</td>${balCell(a)}${limCells(a)}<td class="num"><input class="mini" type="number" step="any" min="0" value="${+a.stmt||''}" placeholder="0" data-act="stmt" data-id="${a.id}" aria-label="Last statement balance of ${esc(a.name)}"></td><td><input class="mid${+a.stmt>0&&!a.duedate?' need':''}" type="date" value="${esc(a.duedate||'')}" data-act="duedate" data-id="${a.id}" aria-label="Payment due date of ${esc(a.name)}"></td><td class="num"><input class="mini" type="number" step="any" min="0" value="${+a.typ||''}" placeholder="none" data-act="typ" data-id="${a.id}" aria-label="Typical monthly payment of ${esc(a.name)}"></td><td>${esc(acctName(a.payfrom))}</td>${endCell(a)}${btns(a)}</tr>`).join(''),`<th>Name</th><th class="num">Owed now</th><th class="num">Limit</th><th class="num">Used</th><th class="num">Available</th><th class="num">Statement balance</th><th>Due date</th><th class="num">Typical monthly</th><th>Pays from</th>${endTh}<th></th>`)}<p class="muted" style="font-size:13px">Only the statement balance is scheduled, on its due date. Later months stay empty unless you enter a typical monthly payment. When a new statement posts, update the balance and date.${tLim?` Across cards with a limit: ${f0(tOwed)} owed of ${f0(tLim)}, ${f0(tLim-tOwed)} available (${Math.round(tOwed/tLim*100)}% used).`:''}</p></div>`:''}
  ${loans.length?`<div class="sec"><h2>Loans</h2>${tbl(loans.map(a=>`<tr><td>${esc(a.name)}</td>${balCell(a)}<td class="num">${+a.apr?(+a.apr)+'%':'—'}</td><td class="num">${+a.min?f2(+a.min):'—'}</td><td><input class="mid${+a.min>0&&!a.pdate?' need':''}" type="date" value="${esc(a.pdate||'')}" data-act="pdate" data-id="${a.id}" aria-label="Next payment date of ${esc(a.name)}"></td><td>${esc(acctName(a.lfrom))}</td><td>${esc(payoff(a))}</td>${anyLim?`<td>${+a.limit?f0(+a.limit)+' limit, '+f0(+a.limit-(+a.bal||0))+' available':'—'}</td>`:''}${endCell(a)}${btns(a)}</tr>`).join(''),`<th>Name</th><th class="num">Owed</th><th class="num">APR</th><th class="num">Payment</th><th>Next due</th><th>Pays from</th><th>Debt-free in</th>${anyLim?'<th>Credit line</th>':''}${endTh}<th></th>`)}</div>`:''}`;
}
function txFiltered(){
  const items=(tx[mk(view)]||{items:[]}).items,q=fq.toLowerCase();
  return items.filter(t=>(!q||t.desc.toLowerCase().includes(q))&&(!fcat||t.cat===fcat)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
}
function txSum(){
  const l=txFiltered().filter(t=>t.cat!=='Transfer'),sp=-l.filter(t=>t.cat!=='Income').reduce((s,t)=>s+t.amt,0),rc=l.filter(t=>t.cat==='Income').reduce((s,t)=>s+t.amt,0);
  return`${l.length} transactions, ${f2(sp)} spent, ${f2(rc)} received`;
}
function txRows(){
  const l=txFiltered(),cl=catList();
  if(!l.length)return`<tr><td colspan="6" class="muted">No transactions${fq||fcat?' match these filters':' this month'}.</td></tr>`;
  return l.map(t=>{const cats=cl.includes(t.cat)?cl:[...cl,t.cat];return`<tr><td>${dl(t.date)}</td><td>${esc(t.desc)}</td><td><select data-act="tcat" data-id="${t.id}" aria-label="Category">${cats.map(c=>`<option${c===t.cat?' selected':''}>${esc(c)}</option>`).join('')}</select></td><td>${esc(acctName(t.acct))}</td><td class="num ${t.amt>0?'pos':''}">${f2(t.amt)}</td><td class="act"><button class="btn sm" data-act="tedit" data-id="${t.id}">Edit</button> <button class="btn sm ghost danger" data-act="tdel" data-id="${t.id}" aria-label="Delete">×</button></td></tr>`}).join('');
}
function vTx(){
  return`<div class="row" style="margin-top:16px"><button class="btn pri" data-act="tadd">Add transaction</button><button class="btn" data-act="timport">Import statement</button><button class="btn" data-act="trules">Category rules</button></div>
  <div class="row"><input class="grow" id="q" placeholder="Search description" value="${esc(fq)}" aria-label="Search"><select id="fc" style="width:auto"><option value="">All categories</option>${catList().map(c=>`<option${c===fcat?' selected':''}>${esc(c)}</option>`).join('')}</select></div>
  <p id="txs" class="muted">${txSum()}</p>
  <div class="scroll"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Account</th><th class="num">Amount</th><th></th></tr></thead><tbody id="txb">${txRows()}</tbody></table></div>`;
}
function goalCard(g){
  const t=+g.target||0,s=+g.saved||0,pct=t>0?Math.min(100,s/t*100):0,need=goalNeed(g);
  let when='No target date';
  if(g.date){const [y,m]=g.date.split('-').map(Number),ml=(y*12+m-1)-(now.getFullYear()*12+now.getMonth());when=`By ${MON[m-1]} ${y}, ${s>=t?'reached':ml<=0?'due now':ml+' months left'}`}
  return`<div class="goal"><span class="nm">${esc(g.name)}</span><span class="act"><button class="btn sm" data-act="fund" data-id="${g.id}">Add funds</button> <button class="btn sm" data-act="edit" data-kind="goals" data-id="${g.id}">Edit</button> <button class="btn sm ghost danger" data-act="del" data-kind="goals" data-id="${g.id}">Delete</button></span>
  <span class="meta">${f0(s)} of ${f0(t)}, ${when}${need?`, needs ${f0(need)} a month`:''}${g.acct?`, kept in ${esc(acctName(g.acct))}`:''}</span>
  <div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
function vGoals(){
  const grp=(k,title)=>{const l=plan.goals.filter(g=>g.kind===k).sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:1);return l.length?`<div class="sec"><h2>${title}</h2>${l.map(goalCard).join('')}</div>`:''};
  const need=plan.goals.reduce((s,g)=>s+goalNeed(g),0);
  return`<div class="row" style="margin-top:16px"><button class="btn pri" data-act="add" data-kind="goals">Add goal</button>${need?`<span class="muted">Together your goals need <b>${f0(need)}</b> a month to hit their dates.</span>`:''}</div>
  ${plan.goals.length?grp('short','Short term')+grp('long','Long term'):'<div class="empty">No goals yet. Add a fun purchase, a vacation, or a bigger long-term target.</div>'}`;
}
const VIEWS={overview:vOverview,income:()=>vList('income'),bills:()=>vList('bills'),accounts:vAccounts,tx:vTx,goals:vGoals};
function paint(){
  $('#mlabel').textContent=`${MONL[view.m]} ${view.y}`;
  $('#mnav').hidden=tab==='goals';
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===tab));
  $('#main').innerHTML=VIEWS[tab]();
  if(tab==='tx'){
    const up=()=>{$('#txb').innerHTML=txRows();$('#txs').textContent=txSum()};
    $('#q').oninput=e=>{fq=e.target.value;up()};
    $('#fc').onchange=e=>{fcat=e.target.value;up()};
  }
}
async function render(){if(!plan)return;await ensureTx(mk(view));paint()}

/* ---------- events ---------- */
const shift=n=>{const i=view.y*12+view.m+n;view={y:Math.floor(i/12),m:((i%12)+12)%12};render()};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-tab]');if(!b||!plan)return;
  if(b.dataset.tab){tab=b.dataset.tab;lset('ui',{tab});render();return}
  const {act,kind,id}=b.dataset;
  if(act==='prev')shift(-1);else if(act==='next')shift(1);
  else if(act==='today'){view={y:now.getFullYear(),m:now.getMonth()};render()}
  else if(act==='add')edit(kind);else if(act==='edit')edit(kind,id);else if(act==='del')del(kind,id);
  else if(act==='fund')fundGoal(id);
  else if(act==='ics'){const {tips}=project();const sel=b.dataset.i==='all'?tips:[tips[+b.dataset.i]].filter(Boolean);if(sel.length)tipIcs(sel)}
  else if(act==='backup')backup();else if(act==='restore')$('#rf').click();
  else if(act==='tadd')editTx();else if(act==='tedit')editTx(id);
  else if(act==='tdel'){const m=mk(view);tx[m].items=tx[m].items.filter(t=>t.id!==id);saveTx(m);paint()}
  else if(act==='timport')openImport();else if(act==='trules')editRules();
  else if(act==='catadd')openForm('Add category',[{k:'name',l:'Category name',req:1},{k:'budget',l:'Monthly budget',t:'number'}],{},o=>{if(!catList().includes(o.name)){plan.cats.push({name:o.name,budget:o.budget});savePlan()}render()});
  else if(act==='catdel'){const c=b.dataset.cat;ask(`Remove category “${c}”?`,'Remove',()=>{plan.cats=plan.cats.filter(x=>x.name!==c);savePlan();render()})}
});
document.addEventListener('change',e=>{
  const b=e.target.closest('[data-act]');if(!b||!plan)return;const {act,id}=b.dataset;
  if(act==='done'){const k=b.dataset.key;if(b.checked)plan.done[k]=1;else delete plan.done[k];savePlan();paint()}
  else if(act==='planned'){plan.showPlanned=b.checked;savePlan();paint()}
  else if(act==='budget'){const c=plan.cats.find(x=>x.name===b.dataset.cat);if(c){c.budget=Math.max(0,parseFloat(b.value)||0);savePlan();paint()}}
  else if(act==='actual'){
    const k=b.dataset.key,v=b.value.trim(),ap=plan.applied||(plan.applied={}),parts=k.split(':');
    const a=parts[0]==='in'&&parts[1].startsWith('div-')?acct(parts[1].slice(4)):null;
    const undo=()=>{const p=ap[k];if(p&&a){a[p.f]=Math.round(((+a[p.f]||0)-p.v)*100)/100}delete ap[k]};
    if(v===''){undo();delete plan.actual[k];delete plan.done[k]}
    else{const n=parseFloat(v);if(isNaN(n))return;undo();plan.actual[k]=Math.abs(n);plan.done[k]=1;
      if(a){const f=a.divMode==='reinvest'?'bal':'cash',x=Math.abs(n);a[f]=Math.round(((+a[f]||0)+x)*100)/100;ap[k]={f,v:x}}}
    savePlan();paint()}
  else if(act==='cash'){const a=acct(id);if(a){a.cash=parseFloat(b.value)||0;a.upd=TODAY;savePlan();paint()}}
  else if(act==='intin'){plan.interestIn=b.checked;savePlan();paint()}
  else if(act==='apy'){const a=acct(id);if(a){a.apy=Math.max(0,parseFloat(b.value)||0);savePlan();paint()}}
  else if(act==='pdate'){const a=acct(id);if(a){a.pdate=b.value;savePlan();paint()}}
  else if(act==='typ'){const a=acct(id);if(a){a.typ=Math.max(0,parseFloat(b.value)||0);savePlan();paint()}}
  else if(act==='duedate'){const a=acct(id);if(a){a.duedate=b.value;a.upd=TODAY;savePlan();paint()}}
  else if(act==='limit'){const a=acct(id);if(a){a.limit=Math.max(0,parseFloat(b.value)||0);savePlan();paint()}}
  else if(act==='stmt'){const a=acct(id);if(a){a.stmt=Math.max(0,parseFloat(b.value)||0);a.upd=TODAY;savePlan();paint()}}
  else if(act==='bal'){const a=acct(id);if(a){a.bal=parseFloat(b.value)||0;a.upd=TODAY;savePlan();paint()}}
  else if(act==='tcat'){const m=mk(view),t=tx[m].items.find(x=>x.id===id);if(t){t.cat=b.value;saveTx(m);$('#txs').textContent=txSum()}}
});

/* ---------- start ---------- */
$('#rf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)restore(f)};
addEventListener('visibilitychange',()=>{if(document.hidden)flushAll()});
addEventListener('pagehide',flushAll);
(async()=>{
  try{
    if(window.claude&&claude.use){
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      const id=user&&await user.id();
      if(db&&id){S.db=db;S.uid=id}
    }
  }catch(e){}
  try{plan=Object.assign(blank(),await sRead('plan')||{})}
  catch(e){S.locked=true;plan=blank();status('Load failed: reload before editing','bad')}
  if(!S.locked)status(okMsg());
  const ui=lget('ui');if(ui&&VIEWS[ui.tab])tab=ui.tab;
  render();
})();
})();
</script>
</body>
